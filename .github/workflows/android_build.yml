name: MAROAH - Release APK + Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure environment files exist
        run: |
          if [ ! -f .env.example ]; then
            echo "Creating fallback .env.example..."
            printf "%s\n%s\n%s\n%s\n%s\n%s\n%s\n" \
              "MEXC_API_KEY=placeholder" \
              "MEXC_SECRET_KEY=placeholder" \
              "BLOCKBYTE_API_KEY=placeholder" \
              "BLOCKBYTE_SECRET_KEY=placeholder" \
              "RAILWAY_URL=https://maroah-production.up.railway.app" \
              "VERCEL_URL=https://maroah.vercel.app" \
              "SESSION_TOKEN=msIECkh7qAZXR5BfSpvTTCopXpvgDsOSyCyHMUKR0KA=" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding user KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f "$GITHUB_WORKSPACE/maroah.keystore" ]; then
            echo "Using committed maroah.keystore with provided password..."
            cp "$GITHUB_WORKSPACE/maroah.keystore" "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          else
            echo "Using verified fallback release keystore..."
            if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
              base64 -d "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/my-upload-key.jks"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            elif [ -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
              cp "$GITHUB_WORKSPACE/debug.keystore" "$GITHUB_WORKSPACE/my-upload-key.jks"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            else
              echo "Generating new signing keystore..."
              keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MAROAH, OU=Release, O=MAROAH, L=City, S=State, C=US"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_ALIAS=upload" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            fi
          fi
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows MAROAH Server EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          npx --yes @yao-pkg/pkg@6.7.0 server.js --targets node20-win-x64 --output dist/MAROAH-Server.exe
          if (!(Test-Path dist/MAROAH-Server.exe)) { throw 'EXE was not produced' }
          Get-Item dist/MAROAH-Server.exe | Format-List Name,Length,FullName

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Windows-EXE
          path: dist/MAROAH-Server.exe
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Build release bundle
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MAROAH-Release-APK
          path: release

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: MAROAH-Windows-EXE
          path: release

      - name: Upload combined release package
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Release-Package
          path: release
          if-no-files-found: error
          retention-days: 30
