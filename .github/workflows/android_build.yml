name: MAROAH - Release APK + Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK + Windows EXE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Verify Release APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install

      - name: Build Windows EXE
        shell: bash
        run: |
          mkdir -p dist
          npx --yes @yao-pkg/pkg@6.7.0 server.js --targets node20-win-x64 --output dist/MAROAH-Server.exe
          test -s dist/MAROAH-Server.exe
          ls -lh dist/MAROAH-Server.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Windows-EXE
          path: dist/MAROAH-Server.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload combined release package
        uses: actions/upload-artifact@v4
        with:
          name: MAROAH-Release-Package
          path: |
            app/build/outputs/apk/release/app-release.apk
            dist/MAROAH-Server.exe
          if-no-files-found: error
          retention-days: 30
